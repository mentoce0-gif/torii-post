name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx @11ty/eleventy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One deployment at a time. Without this, several pushes in an evening
    # queue up together and an older run can finish last, quietly replacing
    # the live site with an older build. Intermediate queued runs are dropped;
    # in-progress ones are left alone to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages regularly takes longer than the 10-minute default to report
          # back, and the action then cancels a deployment that was going to
          # succeed. Every failure on 2026-08-06 was this, not a broken build.
          timeout: 1800000
