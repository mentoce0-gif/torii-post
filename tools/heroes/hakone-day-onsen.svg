<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Left: the mountain and the bath at the bottom of it. Right: the trip
       itself — the Tozan line climbing in switchbacks, and the same-day
       return that makes this a day trip rather than a stay. -->
