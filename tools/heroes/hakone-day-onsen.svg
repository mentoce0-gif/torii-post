  <rect width="430" height="630" fill="#ECEEED"/>

  <path d="M 70 430 L 200 210 L 330 430" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 157 302 L 178 272 L 200 296 L 223 268 L 245 300" fill="none" stroke="#2F4F4F" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <g stroke="#2F4F4F" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M 155 455 c -18 -34 18 -50 0 -84"/>
    <path d="M 215 462 c -20 -40 20 -60 0 -100"/>
    <path d="M 275 455 c -18 -34 18 -50 0 -84"/>
  </g>

  <rect x="100" y="470" width="230" height="56" rx="27" fill="none" stroke="#1A1A1A" stroke-width="8"/>
  <path d="M 128 498 h 174" stroke="#2F4F4F" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

  <path d="M 530 470 L 700 470 L 700 380 L 870 380 L 870 290 L 1040 290"
        fill="none" stroke="#1A1A1A" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <g fill="#FAFAF9" stroke="#2F4F4F" stroke-width="6">
    <circle cx="530" cy="470" r="13"/>
    <circle cx="785" cy="380" r="13"/>
    <circle cx="1040" cy="290" r="13"/>
  </g>

  <g stroke="#2F4F4F" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M 1022 250 c -12 -22 12 -33 0 -55"/>
    <path d="M 1058 250 c -12 -22 12 -33 0 -55"/>
  </g>

  <path d="M 1010 175 C 880 108, 650 120, 548 196" fill="none" stroke="#2F4F4F" stroke-width="4" stroke-dasharray="3 16" stroke-linecap="round"/>
  <path d="M 548 196 l 22 -4 M 548 196 l 13 17" fill="none" stroke="#2F4F4F" stroke-width="4" stroke-linecap="round"/>

  <g transform="translate(1075,545)" fill="#1A1A1A">
    <rect x="-2" y="0" width="74" height="8"/>
