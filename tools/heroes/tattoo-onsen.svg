    <path d="M 215 300 c -20 -40 20 -60 0 -100"/>
    <path d="M 262 290 c -18 -34 18 -50 0 -84"/>
  </g>

  <g stroke="#1A1A1A" fill="none" stroke-linecap="round">
    <path d="M 100 340 h 230" stroke-width="10"/>
    <path d="M 110 345 v 150 h 100 v -150" stroke-width="8"/>
    <path d="M 220 345 v 150 h 100 v -150" stroke-width="8"/>
    <path d="M 143 525 h 144" stroke-width="10"/>
