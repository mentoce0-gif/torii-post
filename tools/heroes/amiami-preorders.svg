<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Left: the preorder itself — a boxed figure, reserved but not paid for.
       Right: the shape of the wait. A long dashed gap with no money moving,
       then the payment request envelope, then seven short ticks and a gate
       that closes. The whole article is about that second half. -->
  <rect width="1200" height="630" fill="#FAFAF9"/>
  <rect width="430" height="630" fill="#ECEEED"/>

  <!-- boxed figure: the thing you reserved -->
  <rect x="128" y="196" width="174" height="238" rx="6" fill="none" stroke="#1A1A1A" stroke-width="9"/>
  <path d="M 128 258 h 174" stroke="#1A1A1A" stroke-width="7"/>
  <circle cx="215" cy="322" r="34" fill="none" stroke="#2F4F4F" stroke-width="7"/>
  <path d="M 215 356 v 46 M 215 372 l -30 22 M 215 372 l 30 22" fill="none" stroke="#2F4F4F" stroke-width="7" stroke-linecap="round"/>
  <path d="M 160 228 h 44" stroke="#2F4F4F" stroke-width="6" stroke-linecap="round" opacity="0.55"/>

  <!-- zero yen: nothing is taken at this end -->
  <g stroke="#2F4F4F" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M 168 476 l 22 26 l 22 -26"/>
    <path d="M 190 502 v 34"/>
    <path d="M 170 512 h 40 M 170 526 h 40"/>
  </g>
  <circle cx="262" cy="506" r="25" fill="none" stroke="#1A1A1A" stroke-width="7"/>
  <path d="M 244 524 L 280 488" stroke="#1A1A1A" stroke-width="7" stroke-linecap="round"/>

  <!-- the timeline -->
  <path d="M 530 300 h 92" fill="none" stroke="#1A1A1A" stroke-width="7" stroke-linecap="round"/>
  <path d="M 622 300 C 700 300, 760 300, 838 300" fill="none" stroke="#2F4F4F" stroke-width="5" stroke-dasharray="3 18" stroke-linecap="round"/>
  <circle cx="530" cy="300" r="14" fill="#FAFAF9" stroke="#2F4F4F" stroke-width="6"/>

  <!-- payment request envelope -->
  <rect x="838" y="264" width="104" height="72" rx="5" fill="#FAFAF9" stroke="#1A1A1A" stroke-width="8"/>
  <path d="M 838 270 L 890 308 L 942 270" fill="none" stroke="#2F4F4F" stroke-width="7" stroke-linejoin="round"/>

  <!-- seven days -->
  <g stroke="#1A1A1A" stroke-width="7" stroke-linecap="round">
    <path d="M 966 300 h 16"/><path d="M 994 300 h 16"/><path d="M 1022 300 h 16"/>
    <path d="M 1050 300 h 16"/><path d="M 1078 300 h 16"/><path d="M 1106 300 h 16"/>
  </g>

  <!-- the gate that closes at the end of them -->
  <path d="M 1140 236 v 128" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round"/>
  <path d="M 1140 236 L 1102 214 M 1140 364 L 1102 386" fill="none" stroke="#2F4F4F" stroke-width="6" stroke-linecap="round"/>

  <!-- the window in which cancelling is still possible, marked under the gap -->
  <path d="M 530 392 h 300" fill="none" stroke="#2F4F4F" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 530 382 v 20 M 830 382 v 20" stroke="#2F4F4F" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
